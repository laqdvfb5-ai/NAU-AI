name: nau-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: nau_ai
      POSTGRES_USER: nau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nau -d nau_ai']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nau:${POSTGRES_PASSWORD}@postgres:5432/nau_ai
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      APP_URL: https://${DOMAIN}
      DATA_DIR: /app/.data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes: [api-data:/app/.data]
  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    logging: *default-logging
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  api-data:
  caddy-data:
  caddy-config:
